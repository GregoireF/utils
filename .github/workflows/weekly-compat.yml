name: Weekly Compat

on:
  schedule:
    - cron: 0 9 * * 1 # Monday 9:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  compat:
    name: Latest deps
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Update all deps to latest
        run: pnpm update --latest --recursive

      - name: Build
        run: pnpm turbo run build

      - name: Lint · Typecheck · Test
        run: pnpm turbo run lint typecheck test

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Weekly compat failure — ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              'The weekly compatibility check against **latest** peer dependencies failed.',
              '',
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check which dependency update caused the breakage and update the affected package(s).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['compat-failure'],
            });
