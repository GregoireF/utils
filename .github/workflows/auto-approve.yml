name: Auto-approve

# Approves PRs targeting main after CI passes.
# Enables Code-Review Scorecard check for a solo-dev workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ github.event.workflow_run.id }}" \
            --jq '.pull_requests[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr review "$PR" \
              --repo "$GITHUB_REPOSITORY" \
              --approve \
              --body "CI passed â€” auto-approved."
          fi
