name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Audit · Build · Lint · Typecheck · Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
      fail-fast: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --prod --audit-level=moderate

      - name: Build
        run: pnpm turbo run build

      - name: Lint · Typecheck · Test
        run: pnpm turbo run lint typecheck test

      - name: Upload coverage (result)
        if: matrix.node-version == 22
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/result/coverage/coverage-summary.json
          flags: result
          fail_ci_if_error: false

      - name: Upload coverage (http-client)
        if: matrix.node-version == 22
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/http-client/coverage/coverage-summary.json
          flags: http-client
          fail_ci_if_error: false

      - name: Upload coverage (ts-utils)
        if: matrix.node-version == 22
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/ts-utils/coverage/coverage-summary.json
          flags: ts-utils
          fail_ci_if_error: false

      - name: Upload coverage (env-validator)
        if: matrix.node-version == 22
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/env-validator/coverage/coverage-summary.json
          flags: env-validator
          fail_ci_if_error: false

      - name: Upload coverage (logger)
        if: matrix.node-version == 22
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/logger/coverage/coverage-summary.json
          flags: logger
          fail_ci_if_error: false

      - name: Upload coverage (date)
        if: matrix.node-version == 22
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/date/coverage/coverage-summary.json
          flags: date
          fail_ci_if_error: false
