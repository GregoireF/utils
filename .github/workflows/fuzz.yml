name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1" # Monday 7:00 UTC (before Weekly Compat at 9:00)
  workflow_dispatch:

permissions: read-all

jobs:
  fuzz:
    name: Jazzer.js fuzz targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build

      - name: Install Jazzer.js
        run: pnpm add --global @jazzer.js/core

      - name: Fuzz — result
        run: jazzer fuzz/result.fuzz.js -- -max_total_time=60

      - name: Fuzz — env-validator
        run: jazzer fuzz/env-validator.fuzz.js -- -max_total_time=60

      - name: Fuzz — ts-utils
        run: jazzer fuzz/ts-utils.fuzz.js -- -max_total_time=60
