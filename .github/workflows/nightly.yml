name: Nightly

on:
  schedule:
    - cron: "0 3 * * *" # Daily 3:00 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  publish-canary:
    name: Publish canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm turbo run build

      - name: Stamp canary version
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          find packages configs -name "package.json" -not -path "*/node_modules/*" | while read f; do
            NAME=$(node -p "try{require('./$f').name}catch{''}")
            if echo "$NAME" | grep -q "^@gregoiref/"; then
              BASE=$(node -p "require('./$f').version.replace(/-canary.*/, '')")
              CANARY="${BASE}-canary.${DATE}.${SHA}"
              node -e "
                const fs = require('fs');
                const pkg = JSON.parse(fs.readFileSync('$f', 'utf8'));
                pkg.version = '$CANARY';
                fs.writeFileSync('$f', JSON.stringify(pkg, null, 2) + '\n');
              "
              echo "Stamped $NAME $CANARY"
            fi
          done

      - name: Publish canary packages
        run: pnpm -r publish --tag canary --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
