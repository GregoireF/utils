version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    groups:
      dev-tools:
        patterns:
          - "@biomejs/*"
          - "husky"
          - "lint-staged"
          - "turbo"
          - "typescript"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
